<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisar precios · Parrillas Hyundai Creta</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f3f1ee;color:#222;padding-bottom:120px}header{background:#c62828;color:#fff;padding:16px}h1{font-size:20px;margin:0}header p{margin:6px 0 0;font-size:14px}section{background:#fff;margin:10px 8px;border-radius:12px;padding:10px;border:3px solid transparent}section.ch{border-color:#f9a825}h2{font-size:16px;margin:0 0 4px}.dif{color:#c62828;font-size:13px;margin:0 0 8px}.all{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:14px}.all input{width:80px}.row{display:flex;gap:8px;overflow-x:auto}article{min-width:150px;flex:0 0 150px}article img{width:150px;height:112px;object-fit:cover;border-radius:6px;background:#333}article b{display:block;font-size:15px}article small{color:#666;font-size:12px}input{font-size:18px;padding:6px;width:100px;border:1px solid #999;border-radius:6px}.bar{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bar button{font-size:15px;padding:10px;border:0;border-radius:8px}#cw{background:#25d366}#cnt{width:100%;font-size:13px}.bar textarea{width:100%;height:90px}#mm{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.mb{background:#fff;padding:12px;border-radius:10px;width:90%}.mb textarea{width:100%;height:200px}</style></head><body data-pack="precios-creta-26nov" data-vend="Parrillas Creta"><header><h1>REVISAR PRECIOS · Parrillas Hyundai Creta</h1><p>2 piezas. Cambia el precio de la que esté mal y toca Enviar correcciones.</p></header>
<section><h2>Parrilla Hyundai Creta</h2><p class="dif">2 pieza(s)</p><div class="all">Todas a $<input type="number" inputmode="numeric" class="ta"></div><div class="row">
<article data-cod="444" data-t="Parrilla HYUNDAI CRETA 2016-18"><img loading="lazy" src="../f/462.webp"><b>444</b><small>Original · 2016-18</small><br>$<input type="number" inputmode="numeric" class="pi" value="60" data-orig="60"></article>
<article data-cod="466" data-t="Parrilla HYUNDAI CRETA 2021-23"><img loading="lazy" src="../f/493.webp"><b>466</b><small>Original · 2021-23</small><br>$<input type="number" inputmode="numeric" class="pi" value="40" data-orig="40"></article>
</div></section>
<div class="bar"><span id="cnt"></span><button id="cw">Enviar correcciones por WhatsApp</button><button id="cc">Ver / copiar</button><button id="rst">Borrar</button></div>
<script>
const PK=document.body.dataset.pack,VD=document.body.dataset.vend,K='rb-corr-'+PK,A=[...document.querySelectorAll('article')];let G={};try{G=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
function sv(){try{localStorage.setItem(K,JSON.stringify(G))}catch(e){}}
function up(a){const i=a.querySelector('.pi'),c=a.dataset.cod;if(i.value&&i.value!==i.dataset.orig)G[c]={p:i.value};else delete G[c];sv();mark();cuenta()}
function mark(){document.querySelectorAll('section').forEach(s=>s.classList.toggle('ch',[...s.querySelectorAll('article')].some(a=>G[a.dataset.cod])))}
A.forEach(a=>{const i=a.querySelector('.pi');if(G[a.dataset.cod])i.value=G[a.dataset.cod].p;i.oninput=()=>up(a)});
document.querySelectorAll('.ta').forEach(t=>t.oninput=()=>{t.closest('section').querySelectorAll('article').forEach(a=>{a.querySelector('.pi').value=t.value||a.querySelector('.pi').dataset.orig;up(a)})});
function texto(){const L=A.filter(a=>G[a.dataset.cod]).map(a=>'• '+a.dataset.cod+' ('+a.dataset.t+'): precio $'+a.querySelector('.pi').dataset.orig+' → $'+G[a.dataset.cod].p);return L.length?'CORRECCIONES CATÁLOGO · Pack '+PK+' ('+VD+')\n'+L.join('\n'):''}
function cuenta(){const n=Object.keys(G).length;document.getElementById('cnt').textContent=n?n+' cambio(s) guardados en este teléfono':'Sin cambios todavía.'}
function copiar(t){return new Promise((ok,no)=>{const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand('copy')}catch(e){}a.remove();r?ok():no()};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb()})}
document.getElementById('cw').onclick=()=>{const t=texto();if(!t)return alert('No hay cambios.');window.open('https://wa.me/50761601991?text='+encodeURIComponent(t),'_blank')};
document.getElementById('cc').onclick=()=>{const t=texto();if(!t)return alert('No hay cambios.');let x=document.getElementById('vx');if(!x){x=document.createElement('textarea');x.id='vx';x.readOnly=true;document.querySelector('.bar').appendChild(x)}x.value=t;copiar(t).catch(()=>{})};
document.getElementById('rst').onclick=()=>{if(confirm('¿Borrar tus cambios?')){localStorage.removeItem(K);location.reload()}};
mark();cuenta();
</script></body></html>
