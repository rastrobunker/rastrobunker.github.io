async function guardar(n,blob){let d=null;try{d=window.claude?await window.claude.use('downloads'):null}catch(e){}if(d){await d.save({filename:n,data:blob});return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function cuenta(){document.getElementById('cnt').textContent=S.hechas.length+' de '+D.length+' publicadas';document.getElementById('pr').style.width=(100*S.hechas.length/D.length)+'%'}
function ver(){cuenta();ay.textContent='';if(S.i>=D.length)return final();const x=D[S.i],ya=S.hechas.includes(x.r);
v.innerHTML=`<div class="card"><div class="ref">Pieza ${S.i+1} de ${D.length} · Ref. ${x.r}${ya?' · ✅ ya publicada':''}</div><div class="tt">${x.t.replace(/</g,'&lt;')}</div><img src="${x.i}" alt="">
<button class="paso" data-k="f"><b>1</b><span>Guardar la foto<br><em>Se guarda en tu galería</em></span></button>
<div class="mp">Ahora abre Facebook → <b>Marketplace</b> → <b>Vender</b> → <b>Artículo</b>, agrega la foto y vuelve aquí.</div>
<button class="paso" data-k="t"><b>2</b><span>Copiar título<br><em>Pégalo en "Título"</em></span></button>
<button class="paso" data-k="p"><b>3</b><span>Copiar precio: $${x.p}<br><em>Pégalo en "Precio"</em></span></button>
<div class="mp">Categoría: <b>Piezas y accesorios para vehículos</b> · Estado: <b>Usado</b></div>
<button class="paso" data-k="d"><b>4</b><span>Copiar descripción<br><em>Pégala en "Descripción" y toca Publicar</em></span></button>
<button class="listo">✅ Ya la publiqué · Siguiente</button>
<div class="nav"><button id="at">← Anterior</button><button id="sa">Saltar →</button></div><div class="nav"><button id="ir1">⏮ Empezar desde la 1</button><select id="ir" style="flex:1;font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc;background:#fff">${D.map((y,j)=>`<option value="${j}"${j===S.i?" selected":""}>Ir a la ${j+1} · ${y.r}</option>`).join("")}</select></div></div>`;
v.querySelectorAll('.paso').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;try{if(k==='f'){ay.textContent='Guardando foto…';await guardar(x.r+'.jpg',aBlob(x.i));ay.textContent='Foto guardada. Ahora ve a Marketplace.'}else{await copiar(k==='t'?x.t:k==='p'?x.p:x.d);ay.textContent=(k==='t'?'Título':k==='p'?'Precio':'Descripción')+' copiado. Pégalo en Marketplace.'}b.classList.add('ok')}catch(e){ay.textContent=e&&e.code==='declined'?'No se guardó la foto.':(k==='f'?'No se pudo guardar la foto. Mantén presionada la foto y toca Guardar imagen.':'No se pudo. Mantén presionado y copia a mano.')}});
v.querySelector('.listo').onclick=()=>{if(!S.hechas.includes(x.r)){S.hechas.push(x.r);RB_REG(x)}S.i++;sv();ver();scrollTo(0,0)};
document.getElementById('ir1').onclick=()=>{S.i=0;sv();ver();scrollTo(0,0)};document.getElementById('ir').onchange=e=>{S.i=+e.target.value;sv();ver();scrollTo(0,0)};
document.getElementById('at').onclick=()=>{if(S.i>0){S.i--;sv();ver();scrollTo(0,0)}};document.getElementById('sa').onclick=()=>{S.i++;sv();ver();scrollTo(0,0)}}
function final(){v.innerHTML=`<div class="card fin"><div style="font-size:48px">🎉</div><div class="tt">Terminaste la lista</div><div>Publicaste ${S.hechas.length} de ${D.length} piezas.</div><button class="listo" id="av">Avisar por WhatsApp</button><div class="nav"><button id="rv">Volver a la primera</button></div></div>`;
document.getElementById('av').onclick=()=>window.open('https://wa.me/50761601991?text='+encodeURIComponent('Búnker Nº3 · disponibles otra vez: publiqué '+S.hechas.length+' de '+D.length+'.\nReferencias: '+S.hechas.join(', ')),'_blank');document.getElementById('rv').onclick=()=>{S.i=0;sv();ver()}}
ver();
</script></body></html>
