<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121213">
<title>Rastro Búnker · Subir fotos</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121213;--card:#1d1d1f;--chip:#2a2927;--line:#34322f;--ink:#f2efea;--mute:#a19b94;--red:#c2001f;--red2:#9a0019;--ok:#4fbf7f;--warn:#e89a4a;--cobre:#b87a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:19px;line-height:1.25}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 14px calc(110px + env(safe-area-inset-bottom,0))}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:2px solid var(--red)}
header img{width:40px;height:40px;border-radius:8px}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:1}
header button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:15px}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
label{display:block;font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px 12px;font:inherit;font-size:20px}
input:focus{outline:2px solid var(--cobre);outline-offset:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-size:23px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--red);margin-top:14px;cursor:pointer}
.btn:active{background:var(--red2)}
.btn.sec{background:var(--chip);border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:#1f8f4e}
.btn[disabled]{opacity:.45}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .btn{margin-top:0;font-size:20px;padding:20px 8px;flex-direction:column;gap:2px}
.dos .btn span{font-size:30px;line-height:1}
.cuenta{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.cuenta b{font-size:40px;font-weight:700;line-height:1}
.cuenta small{color:var(--mute);font-size:16px;text-transform:uppercase;letter-spacing:.8px}
.cuenta button{background:none;border:0;color:var(--mute);font:inherit;font-size:16px;text-decoration:underline}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{position:relative;aspect-ratio:1;background:var(--chip);border-radius:8px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);border-radius:5px;padding:0 6px;font-style:normal;font-size:14px}
.th button{position:absolute;right:3px;top:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.72);color:#fff;font-size:18px;line-height:1}
.th.ok::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--ok);background:rgba(0,0,0,.45)}
#barra{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0));background:linear-gradient(transparent,var(--bg) 26%)}
#barra .btn{margin-top:0}
.prog{height:12px;background:var(--chip);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.prog div{height:100%;width:0;background:var(--cobre);transition:width .25s}
.msg{color:var(--mute);font-size:17px}
.err{color:var(--warn);margin-top:10px;font-size:18px}
.gran{font-size:64px;line-height:1;color:var(--ok);text-align:center}
.cen{text-align:center}
h2{margin:6px 0 4px;font-size:30px;text-transform:uppercase;letter-spacing:.5px}
ol{margin:8px 0 0;padding-left:22px;color:var(--mute);font-size:18px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>Subir fotos</h1>
  <button id="salir" class="hide">Salir</button>
</header>

<!-- ENTRAR -->
<section id="vLogin" class="card hide">
  <h2>Entrar</h2>
  <div class="msg">Solo la primera vez. Queda guardado en este teléfono.</div>
  <label for="usr">Usuario</label>
  <input id="usr" type="text" autocomplete="username" autocapitalize="none" placeholder="ej. salobunker">
  <label for="key">Clave de acceso</label>
  <input id="key" type="password" autocomplete="current-password" placeholder="pegar la clave">
  <button class="btn" id="entrar">Entrar</button>
  <div class="err hide" id="eLogin"></div>
</section>

<!-- ELEGIR FOTOS -->
<section id="vFotos" class="hide">
  <div class="card">
    <div class="dos">
      <button class="btn" id="bCam"><span>📷</span>Tomar foto</button>
      <button class="btn sec" id="bGal"><span>🖼️</span>Elegir de galería</button>
    </div>
    <label for="nota">Qué son (opcional)</label>
    <input id="nota" type="text" placeholder="ej. defensas traseras, lámparas…">
    <ol>
      <li>Una foto por pieza, con la cinta que se lea.</li>
      <li>Cuando termines, toca <b>Subir lote</b> y no cierres la página.</li>
    </ol>
  </div>
  <div class="cuenta"><div><b id="n">0</b> <small>fotos en el lote</small></div><button id="vaciar" class="hide">Quitar todas</button></div>
  <div id="grid"></div>
  <input id="fCam" class="hide" type="file" accept="image/*" capture="environment">
  <input id="fGal" class="hide" type="file" accept="image/*" multiple>
  <div id="barra"><button class="btn" id="subir" disabled>Subir lote</button></div>
</section>

<!-- SUBIENDO -->
<section id="vSube" class="card hide">
  <h2>Subiendo…</h2>
  <div class="prog"><div id="pb"></div></div>
  <div class="msg" id="pt">Preparando</div>
  <div class="msg">No cierres ni cambies de aplicación hasta que termine.</div>
  <div class="err hide" id="eSube"></div>
  <button class="btn hide" id="reint">Reintentar</button>
</section>

<!-- LISTO -->
<section id="vListo" class="card cen hide">
  <div class="gran">✓</div>
  <h2 id="lt">Lote subido</h2>
  <div class="msg" id="ld"></div>
  <button class="btn wa" id="avisar">Avisar por WhatsApp</button>
  <button class="btn sec" id="otro">Subir otro lote</button>
</section>

<script>
(function(){
'use strict';
var REPO='rastrobunker/rastrobunker.github.io', RAMA='entrada', API='https://api.github.com/repos/'+REPO;
var MAXLADO=2000, CAL=0.85;
var $=function(id){return document.getElementById(id)};
var fotos=[], seq=0, subidas=[], ocupado=false, ultimo=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
var usuario=lsGet('rb_sub_usr')||'', clave=lsGet('rb_sub_key')||'';

function ver(id){['vLogin','vFotos','vSube','vListo'].forEach(function(v){$(v).classList.toggle('hide',v!==id)});
  $('salir').classList.toggle('hide',id==='vLogin'||id==='vSube');window.scrollTo(0,0)}

function gh(ruta,metodo,cuerpo){
  return fetch(API+ruta,{method:metodo||'GET',headers:{'Authorization':'Bearer '+clave,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:cuerpo?JSON.stringify(cuerpo):undefined,cache:'no-store'}).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok){var e=new Error(j.message||('Error '+r.status));e.status=r.status;throw e}
        return j})})}
function reintenta(fn,veces){return fn().catch(function(e){
  if(veces<=1||e.status===401||e.status===403||e.status===404)throw e;
  return new Promise(function(ok){setTimeout(ok,1500)}).then(function(){return reintenta(fn,veces-1)})})}

/* ---------- entrar ---------- */
$('entrar').onclick=function(){
  var u=$('usr').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,''), k=$('key').value.trim();
  var e=$('eLogin');e.classList.add('hide');
  if(!u||!k){e.textContent='Escribe el usuario y la clave.';e.classList.remove('hide');return}
  clave=k;$('entrar').disabled=true;$('entrar').textContent='Revisando…';
  gh('').then(function(j){
    if(!(j.permissions&&j.permissions.push))throw new Error('Esa clave no tiene permiso para subir.');
    usuario=u;lsSet('rb_sub_usr',u);lsSet('rb_sub_key',k);$('key').value='';ver('vFotos');
  }).catch(function(x){clave='';
    e.textContent=(x.status===401||x.status===404)?'Clave incorrecta o vencida. Pide una nueva.':('No se pudo entrar: '+x.message);
    e.classList.remove('hide');
  }).then(function(){$('entrar').disabled=false;$('entrar').textContent='Entrar'});
};
$('salir').onclick=function(){if(!confirm('¿Salir? Tendrás que volver a poner la clave.'))return;
  lsDel('rb_sub_key');clave='';ver('vLogin');$('usr').value=usuario};

/* ---------- elegir fotos ---------- */
$('bCam').onclick=function(){$('fCam').click()};
$('bGal').onclick=function(){$('fGal').click()};
$('fCam').onchange=$('fGal').onchange=function(ev){
  var fs=ev.target.files;for(var i=0;i<fs.length;i++){if(/^image\//.test(fs[i].type)||/\.(jpe?g|png|heic|webp)$/i.test(fs[i].name))
    fotos.push({id:++seq,file:fs[i],url:URL.createObjectURL(fs[i])})}
  ev.target.value='';pinta();
};
$('vaciar').onclick=function(){if(confirm('¿Quitar las '+fotos.length+' fotos?')){fotos.forEach(function(f){URL.revokeObjectURL(f.url)});fotos=[];pinta()}};
function pinta(){
  var g=$('grid');g.innerHTML='';
  fotos.forEach(function(f,i){
    var d=document.createElement('div');d.className='th';d.id='th'+f.id;
    var im=document.createElement('img');im.loading='lazy';im.src=f.url;im.alt='';
    var n=document.createElement('i');n.textContent=i+1;
    var b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','Quitar');
    b.onclick=function(){URL.revokeObjectURL(f.url);fotos=fotos.filter(function(x){return x!==f});pinta()};
    d.appendChild(im);d.appendChild(n);d.appendChild(b);g.appendChild(d)});
  $('n').textContent=fotos.length;$('vaciar').classList.toggle('hide',!fotos.length);
  $('subir').disabled=!fotos.length;$('subir').textContent=fotos.length?('Subir lote · '+fotos.length+' fotos'):'Subir lote';
}

/* ---------- comprimir ---------- */
function aLienzo(file){
  var p=window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return null}):Promise.resolve(null);
  return p.then(function(bm){
    if(bm)return bm;
    return new Promise(function(ok,no){var im=new Image();im.onload=function(){ok(im)};im.onerror=function(){no(new Error('No se pudo leer una foto'))};im.src=URL.createObjectURL(file)})
  }).then(function(src){
    var w=src.width,h=src.height,k=Math.min(1,MAXLADO/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);if(src.close)src.close();return c})}
function aBase64(file){
  return aLienzo(file).then(function(c){return new Promise(function(ok,no){
    c.toBlob(function(b){if(!b){no(new Error('No se pudo comprimir'));return}
      var r=new FileReader();r.onload=function(){ok({b64:String(r.result).split(',')[1],kb:Math.round(b.size/1024)})};r.onerror=function(){no(new Error('No se pudo leer'))};r.readAsDataURL(b)},'image/jpeg',CAL)})})}

/* ---------- subir ---------- */
function dos(n){return (n<10?'0':'')+n}
function tres(n){return ('00'+n).slice(-3)}
function avance(h,t,txt){$('pb').style.width=Math.round(100*h/t)+'%';$('pt').textContent=txt}

function subirLote(){
  if(ocupado)return;ocupado=true;ver('vSube');$('eSube').classList.add('hide');$('reint').classList.add('hide');
  var total=fotos.length,hechas=subidas.length,cola=fotos.filter(function(f){return !f.sha});
  var bloqueo=null;if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){bloqueo=l}).catch(function(){});
  avance(hechas,total+1,'Foto '+hechas+' de '+total);
  function una(){
    var f=cola.shift();if(!f)return Promise.resolve();
    return aBase64(f.file).then(function(d){f.kb=d.kb;
      return reintenta(function(){return gh('/git/blobs','POST',{content:d.b64,encoding:'base64'})},4)
    }).then(function(j){f.sha=j.sha;hechas++;avance(hechas,total+1,'Foto '+hechas+' de '+total);return una()})}
  Promise.all([una(),una()]).then(function(){
    avance(total,total+1,'Guardando el lote…');
    var a=new Date(),carpeta='lotes/'+a.getFullYear()+'-'+dos(a.getMonth()+1)+'-'+dos(a.getDate())+'_'+dos(a.getHours())+dos(a.getMinutes())+'_'+usuario;
    var nota=$('nota').value.trim();
    var arbol=fotos.map(function(f,i){return {path:carpeta+'/'+tres(i+1)+'.jpg',mode:'100644',type:'blob',sha:f.sha}});
    arbol.push({path:carpeta+'/lote.json',mode:'100644',type:'blob',content:JSON.stringify({usuario:usuario,fecha:a.toISOString(),fotos:total,nota:nota,
      originales:fotos.map(function(f){return f.file.name})},null,1)});
    return reintenta(function(){
      return gh('/git/ref/heads/'+RAMA).then(function(ref){var padre=ref.object.sha;
        return gh('/git/commits/'+padre).then(function(c){return gh('/git/trees','POST',{base_tree:c.tree.sha,tree:arbol})})
        .then(function(t){return gh('/git/commits','POST',{message:'Lote '+usuario+': '+total+' fotos'+(nota?' ('+nota+')':''),tree:t.sha,parents:[padre]})})
        .then(function(c){return gh('/git/refs/heads/'+RAMA,'PATCH',{sha:c.sha})})})},4)
    .then(function(){ultimo={n:total,nota:nota,carpeta:carpeta}})
  }).then(function(){
    fotos.forEach(function(f){URL.revokeObjectURL(f.url)});fotos=[];subidas=[];$('nota').value='';pinta();
    $('lt').textContent='Lote subido · '+ultimo.n+' fotos';
    $('ld').textContent='Ya están guardadas. Avisa para que se procesen.';ver('vListo');
  }).catch(function(x){
    subidas=fotos.filter(function(f){return f.sha});
    var m=(x.status===401)?'La clave venció o ya no sirve. Sal, entra con una clave nueva y vuelve a subir.':
      ('Se cortó la subida ('+x.message+'). Revisa el internet y toca Reintentar: no se pierde lo ya subido.');
    $('eSube').textContent=m;$('eSube').classList.remove('hide');$('reint').classList.remove('hide');
  }).then(function(){ocupado=false;if(bloqueo)bloqueo.release().catch(function(){})});
}
$('subir').onclick=function(){if(fotos.length)subirLote()};
$('reint').onclick=subirLote;
window.addEventListener('beforeunload',function(e){if(ocupado||fotos.length){e.preventDefault();e.returnValue=''}});

/* ---------- listo ---------- */
$('avisar').onclick=function(){if(!ultimo)return;
  var t='Lote listo ✅ '+ultimo.n+' fotos subidas por '+usuario+(ultimo.nota?' ('+ultimo.nota+')':'')+'.';
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
$('otro').onclick=function(){ver('vFotos')};

if(clave&&usuario){ver('vFotos')}else{$('usr').value=usuario;ver('vLogin')}
pinta();
})();
</script>
</body>
</html>
